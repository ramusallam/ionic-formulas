<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Writing Ionic Formulas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;700&family=Roboto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bgMain: #F7F3EE; --bgPanel: #FFFFFF; --bgCard: #FFFFFF;
    --accentBlue: #6366f1; --accentBlueHover: #4f46e5; --accentPurple: #a855f7;
    --accentGreen: #10b981; --accentRed: #ef4444; --accentYellow: #f59e0b;
    --textPrimary: #1C1917; --textSecondary: #57534E; --textWarm: #2A2520;
    --textWarmSecondary: #7C6F5A; --textWarmMuted: #A0937B;
    --borderColor: #E8E0D2; --borderSubtle: #F0EBE3;
    --shadow-sm: 0 1px 2px rgba(17,17,17,0.04), 0 1px 3px rgba(17,17,17,0.06);
    --shadow-md: 0 4px 12px rgba(17,17,17,0.06), 0 2px 4px rgba(17,17,17,0.04);
    --shadow-lg: 0 16px 40px rgba(17,17,17,0.10), 0 4px 12px rgba(17,17,17,0.06);
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-serif: 'Roboto Serif', Georgia, Cambria, serif;
    --font-mono: 'Roboto Mono', monospace;
    --note-bg: #fdf1c6; --note-ink: #2a1e08; --note-head: #7a3a00;
    --cation: #d97706; --anion: #0d9488;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--bgMain); color: var(--textPrimary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  header { padding: 12px 32px 8px; max-width: 1340px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  header .titles .eyebrow { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accentBlue); margin-bottom: 3px; }
  header .titles h1 { font-family: var(--font-serif); font-weight: 700; font-size: 20px; color: var(--textWarm); margin: 0; letter-spacing: 0.2px; }
  .progress-track { max-width: 1340px; margin: 0 auto; padding: 0 32px; }
  .progress-track .bar { height: 4px; background: var(--borderSubtle); border-radius: 999px; overflow: hidden; }
  .progress-track .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accentBlue), var(--accentPurple)); border-radius: 999px; transition: width 350ms ease; }
  .step-line { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 8px; }
  .step-line .now { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .step-line .num { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accentBlue); white-space: nowrap; }
  .step-line .ttl { font-family: var(--font-serif); font-size: 14px; font-weight: 700; color: var(--textWarm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step-line .count { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--textWarmMuted); white-space: nowrap; }
  main { max-width: 1340px; margin: 0 auto; padding: 12px 32px 20px; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 0.92fr); gap: 26px; align-items: start; }
  .stage { background: var(--bgCard); border: 1px solid var(--borderColor); border-top: 4px solid var(--accentBlue); border-radius: 16px; box-shadow: var(--shadow-md); padding: 16px 18px; min-height: 440px; display: flex; flex-direction: column; animation: fadeUp 0.4s ease-out; }
  .stage-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accentBlue); margin-bottom: 12px; }
  .stage-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 12px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
  .notes-card { background: var(--note-bg); color: var(--note-ink); padding: 16px 22px 14px; border-radius: 14px; font-size: 15px; line-height: 1.58; box-shadow: var(--shadow-sm); animation: fadeUp 0.4s ease-out; }
  .notes-card .nc-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--note-head); margin-bottom: 6px; }
  .step-heading { font-family: var(--font-serif); font-weight: 700; font-size: 17px; color: var(--note-head); margin-bottom: 6px; }
  .notes-card p { margin: 0; }
  .notes-card strong { font-weight: 700; color: var(--note-ink); }
  .notebook-prompt { background: #fff; border: 1px solid var(--borderColor); border-left: 4px solid var(--accentBlue); border-radius: 12px; padding: 13px 16px; display: flex; align-items: flex-start; gap: 11px; font-size: 14px; line-height: 1.5; color: var(--textSecondary); box-shadow: var(--shadow-sm); }
  .notebook-prompt .np-tag { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; padding: 4px 8px; background: var(--accentBlue); color: #fff; border-radius: 6px; margin-top: 1px; }
  .notebook-prompt strong { color: var(--textPrimary); font-weight: 700; }
  nav { margin-top: auto; display: flex; justify-content: space-between; gap: 12px; padding-top: 4px; }
  button { font-family: var(--font-sans); font-size: 14px; font-weight: 600; padding: 11px 20px; border-radius: 10px; border: 1px solid var(--borderColor); background: #fff; color: var(--textPrimary); cursor: pointer; transition: background 140ms, border-color 140ms, transform 50ms, box-shadow 140ms; }
  button:hover:not(:disabled) { background: var(--bgMain); border-color: var(--textWarmMuted); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accentBlue); color: #fff; border-color: var(--accentBlue); box-shadow: 0 4px 14px rgba(99,102,241,0.28); }
  button.primary:hover:not(:disabled) { background: var(--accentBlueHover); border-color: var(--accentBlueHover); }
  .btn-group { display: flex; gap: 10px; }
  .tool-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { font-family: var(--font-sans); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--borderColor); background: #fff; color: var(--textPrimary); cursor: pointer; transition: all 140ms; }
  .chip:hover { border-color: var(--accentBlue); }
  .chip.active { background: var(--accentBlue); color: #fff; border-color: var(--accentBlue); }
  .eyebrow-sm { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--textWarmMuted); }
  .diff-pill { display: inline-block; font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
  .diff-simple { color: #166534; background: rgba(16,185,129,0.14); }
  .diff-challenge { color: #9a3412; background: rgba(245,158,11,0.16); }
  .caption { font-style: italic; font-size: 12px; color: var(--textWarmMuted); text-align: center; }
  .status-line { font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--textPrimary); text-align: center; line-height: 1.45; min-height: 22px; }
  .status-line.complete { color: #166534; }
  button svg, .status-line svg { vertical-align: -2px; }

  /* formula + ion chips */
  .formula { font-family: var(--font-serif); font-weight: 700; letter-spacing: 0.5px; }
  .formula sub { font-size: 0.62em; }
  .ion-chip { display: inline-block; font-family: var(--font-serif); font-weight: 700; padding: 6px 12px; border-radius: 10px; font-size: 20px; white-space: nowrap; }
  .ion-chip sup { font-size: 0.58em; font-family: var(--font-mono); vertical-align: super; }
  .ion-chip sub { font-size: 0.6em; vertical-align: sub; }
  .ion-chip.cat { background: rgba(217,119,6,0.12); color: #b45309; border: 1px solid rgba(217,119,6,0.35); }
  .ion-chip.an { background: rgba(13,148,136,0.12); color: #0f766e; border: 1px solid rgba(13,148,136,0.35); }

  /* method machine */
  .machine { display: flex; flex-direction: column; gap: 12px; }
  .m-name { text-align: center; font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--textWarm); }
  .m-name .cat-w { color: #b45309; } .m-name .an-w { color: #0f766e; }
  .move { background: var(--bgMain); border: 1px solid var(--borderColor); border-left: 4px solid var(--accentBlue); border-radius: 12px; padding: 12px 16px; animation: fadeUp 0.3s ease-out; }
  .move .m-lab { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accentBlue); margin-bottom: 6px; }
  .move .m-body { font-size: 15px; line-height: 1.7; color: var(--textPrimary); }
  .move .m-body .ion-chip { vertical-align: middle; margin: 2px 4px 2px 0; }
  .move .m-body sub { font-size: 0.62em; vertical-align: sub; }
  .move .m-body sup { font-size: 0.62em; vertical-align: super; }
  .lcm-badge { font-family: var(--font-mono); font-weight: 700; background: var(--accentYellow); color: #422006; padding: 4px 10px; border-radius: 8px; }
  .m-final { text-align: center; padding: 14px; border-radius: 14px; background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.4); }
  .m-final .big { font-family: var(--font-serif); font-weight: 700; font-size: 40px; color: var(--textWarm); }
  .m-final .big sub { font-size: 0.6em; }
  .m-final .ok { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #166534; margin-top: 4px; }
  .m-wrong { text-align: center; margin-top: 8px; font-family: var(--font-serif); font-size: 22px; color: var(--textWarmMuted); position: relative; display: inline-block; }
  .m-wrong .strike { position: absolute; left: -6px; right: -6px; top: 52%; height: 3px; background: var(--accentRed); transform: scaleX(0); transform-origin: left; animation: strike 0.5s ease-out forwards; }
  @keyframes strike { to { transform: scaleX(1); } }
  .m-wrong-wrap { text-align: center; }
  .m-wrong-note { font-size: 12.5px; color: #b91c1c; font-weight: 600; margin-top: 2px; }

  /* ion picker tiles */
  .ion-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tile { min-width: 62px; padding: 9px 6px; border-radius: 10px; border: 1px solid var(--borderColor); background: #fff; text-align: center; cursor: pointer; transition: all 140ms; }
  .tile:hover { border-color: var(--accentBlue); transform: translateY(-1px); }
  .tile .sym { font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--textWarm); }
  .tile .nm { font-size: 9px; color: var(--textWarmMuted); font-weight: 600; }
  .tile .charge { font-family: var(--font-mono); font-size: 13px; font-weight: 700; margin-top: 2px; min-height: 16px; }
  .tile.revealed.cat { background: rgba(217,119,6,0.10); border-color: rgba(217,119,6,0.45); }
  .tile.revealed.cat .charge { color: #b45309; }
  .tile.revealed.an { background: rgba(13,148,136,0.10); border-color: rgba(13,148,136,0.45); }
  .tile.revealed.an .charge { color: #0f766e; }

  /* mini periodic table */
  .pt-wrap { overflow-x: auto; padding-bottom: 4px; }
  .ptable { display: grid; grid-template-columns: repeat(18, minmax(26px, 1fr)); gap: 3px; min-width: 540px; }
  .pt-h { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em; text-align: center; color: var(--textWarmMuted); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px; }
  .pt-cell { aspect-ratio: 1; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 700; font-size: 13px; border: 1px solid var(--borderSubtle); background: #fbfaf7; color: var(--textWarmMuted); line-height: 1; }
  .pt-cell.cat { background: rgba(217,119,6,0.07); }
  .pt-cell.an  { background: rgba(13,148,136,0.07); }
  .pt-cell.tr  { background: rgba(168,85,247,0.07); }
  .pt-cell.noble { background: rgba(100,116,139,0.08); }
  .pt-cell.hi { cursor: pointer; color: var(--textWarm); border-width: 1.5px; box-shadow: var(--shadow-sm); }
  .pt-cell.hi.cat { border-color: rgba(217,119,6,0.55); }
  .pt-cell.hi.an  { border-color: rgba(13,148,136,0.55); }
  .pt-cell.hi.tr  { border-color: rgba(168,85,247,0.5); }
  .pt-cell.hi:hover { transform: translateY(-1px); }
  .pt-cell.on.cat { background: rgba(217,119,6,0.2); }
  .pt-cell.on.an  { background: rgba(13,148,136,0.2); }
  .pt-cell.on.tr  { background: rgba(168,85,247,0.2); }
  .pt-cell .pt-chg { font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; min-height: 9px; margin-top: 1px; }
  .pt-cell.cat .pt-chg { color: #b45309; } .pt-cell.an .pt-chg { color: #0f766e; } .pt-cell.tr .pt-chg { color: #7c3aed; }
  .pt-span { grid-column: 3 / 13; font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-align: center; color: #7c3aed; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px; }
  .pt-read { min-height: 20px; }
  .pt-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; color: var(--textWarmMuted); }
  .pt-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .pt-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  /* practice */
  .reveal-btn { display: inline-flex; align-items: center; gap: 7px; background: var(--accentBlue); color: #fff; border: none; border-radius: 999px; font-weight: 700; font-size: 13px; padding: 8px 15px; cursor: pointer; }
  .reveal-btn:hover { background: var(--accentBlueHover); }
  .reveal-content { margin-top: 10px; padding: 12px 14px; background: var(--bgMain); border: 1px solid var(--borderColor); border-left: 4px solid var(--accentGreen); border-radius: 10px; font-size: 14px; line-height: 1.7; color: var(--textPrimary); white-space: pre-line; }
  .reveal-content[hidden] { display: none !important; }
  .q-card { background: #fff; border: 1px solid var(--borderColor); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .q-card + .q-card { margin-top: 12px; }
  .q-card .q-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .q-name { font-weight: 700; font-size: 16px; font-family: var(--font-serif); color: var(--textWarm); }
  .q-num { font-family: var(--font-mono); color: var(--accentBlue); font-weight: 700; margin-right: 8px; }
  .ans-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ans-row input { font-family: var(--font-serif); font-size: 17px; font-weight: 700; padding: 8px 12px; border: 1px solid var(--borderColor); border-radius: 9px; background: #fff; color: var(--textPrimary); width: 150px; }
  .ans-row input:focus { outline: 2px solid var(--accentBlue); outline-offset: -1px; }
  .ans-row input.ok { background: rgba(16,185,129,0.12); border-color: var(--accentGreen); color: #166534; }
  .ans-row input.no { background: rgba(239,68,68,0.10); border-color: var(--accentRed); }
  .chk-msg { font-size: 12.5px; font-weight: 600; }
  .chk-msg.ok { color: #166534; } .chk-msg.no { color: #b91c1c; }
  .pb-progress { margin-top: 6px; }
  .pb-bar { height: 5px; background: var(--borderSubtle); border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
  .pb-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accentBlue), var(--accentGreen)); transition: width 300ms ease; }
  .pb-text { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--textWarmMuted); }
  .pb-text.complete { color: #166534; }

  /* definition diagram bits */
  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vocab { background: #fff; border: 1px solid var(--borderColor); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
  .vocab .term { font-family: var(--font-serif); font-weight: 700; font-size: 15px; color: var(--textWarm); }
  .vocab .term.cat { color: #b45309; } .vocab .term.an { color: #0f766e; }
  .vocab .def { font-size: 13px; color: var(--textSecondary); margin-top: 3px; line-height: 1.45; }

  @media (max-width: 980px) {
    .workspace { grid-template-columns: 1fr; }
    .stage { min-height: 380px; }
    .side { position: static; }
    header, main { padding-left: 16px; padding-right: 16px; }
    .progress-track { padding: 0 16px; }
    .vocab-grid { grid-template-columns: 1fr; }
  }
  /* A compact Spark header, with the chemistry workspace kept in view. */
  :root { --indigo-2:#818CF8; --indigo-soft:rgba(99,102,241,.09); --indigo-line:rgba(99,102,241,.30); }
  header { max-width:none; padding:22px max(24px,calc((100vw - 1276px)/2)) 46px; background:linear-gradient(145deg,#4f46e5,#6366f1); position:relative; }
  header::before { content:''; position:absolute; inset:0; background:radial-gradient(circle,rgba(255,255,255,.09) 1px,transparent 2px); background-size:30px 30px; pointer-events:none; }
  header .titles { position:relative; }
  header .titles .eyebrow { color:#fff; font-size:11px; }
  header .titles h1 { color:#fff; font-size:clamp(24px,3vw,32px); letter-spacing:-.5px; }
  .progress-track { position:relative; margin-top:-40px; padding:12px 32px 0; }
  .step-line { color:#fff; margin-bottom:12px; }
  .step-line .ttl { display:none; }
  .step-line .num,.step-line .count { color:#fff; font-size:12px; font-variant-numeric:tabular-nums; }
  .progress-track .fill { background:linear-gradient(90deg,var(--accentBlue),var(--indigo-2)); }
  main { padding-top:16px; }
  .workspace { gap:24px; grid-template-columns:minmax(0,1.55fr) minmax(320px,.92fr); }
  .stage { padding:20px; min-height:470px; }
  .notes-card { font-size:16px; line-height:1.55; padding:20px; }
  .notes-card .nc-tag,.stage-label { font-size:11px; }
  .step-heading { font-size:21px; line-height:1.3; margin:0 0 10px; }
  .notebook-prompt { font-size:16px; padding:16px; }
  .notebook-prompt .np-tag { font-size:10px; }
  button { font-size:16px; min-height:44px; padding:10px 16px; }
  button:focus-visible,[role=button]:focus-visible { outline:3px solid var(--accentBlueHover); outline-offset:3px; }
  .caption,.eyebrow-sm,.pb-text { color:var(--textSecondary); font-size:12px; }
  .tile .nm { font-size:11px; color:var(--textSecondary); }
  button.pt-cell { min-height:0; font-size:13px; border-radius:5px; }
  .pt-read { font-size:14px; }
  .chip { font-size:14px; min-height:44px; }
  .practice-top,.practice-nav { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .practice-counter { font:700 12px var(--font-mono); color:var(--textSecondary); font-variant-numeric:tabular-nums; }
  .practice-question { font:700 clamp(24px,3vw,32px) var(--font-serif); line-height:1.2; margin:16px 0; color:var(--textWarm); }
  .practice-label { display:block; font-size:14px; font-weight:600; margin-bottom:8px; }
  .practice-input { width:100%; max-width:360px; font:500 26px var(--font-mono); padding:14px 16px; border:1px solid var(--borderColor); border-radius:12px; color:var(--textPrimary); background:#fff; }
  .practice-input:focus { outline:3px solid var(--indigo-line); border-color:var(--accentBlue); }
  .practice-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .practice-feedback { min-height:42px; font-size:15px; line-height:1.4; padding-top:10px; }
  .practice-feedback.ok { color:#166534; }
  .practice-feedback.no { color:#b91c1c; }
  .practice-solution { margin:10px 0; font-size:15px; line-height:1.5; white-space:normal; }
  .practice-solution ol { margin:0; padding-left:20px; }
  .practice-solution li+li { margin-top:5px; }
  .practice-solution .formula { display:block; font-size:26px; margin-top:8px; }
  .practice-nav { border-top:1px solid var(--borderSubtle); padding-top:12px; margin-top:12px; }
  .pb-text { text-transform:none; letter-spacing:0; font-variant-numeric:tabular-nums; }
  button.primary:disabled { background:var(--borderColor); border-color:var(--borderColor); color:var(--textSecondary); box-shadow:none; opacity:1; }
  .step-check { display:flex; align-items:flex-start; gap:10px; font-size:14px; line-height:1.45; cursor:pointer; }
  .step-check input { width:20px; height:20px; margin:0; flex-shrink:0; accent-color:var(--accentBlue); }
  .gate-status { font-size:13px; line-height:1.45; color:var(--textSecondary); margin:0; }
  [hidden] { display:none !important; }
  @media (max-width:980px) {
    .workspace { grid-template-columns:1fr; }
    .stage { min-height:420px; }
    header { padding:20px 16px 46px; }

<script>
// =====================================================

  right: icn('<path d="m9 18 6-6-6-6"/>'),
  zap: icn('<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>'),

// subscript-render a formula string; charge string builder
const fmt = s => s.replace(/(\d+)/g, '<sub>$1</sub>');
const chg = c => { const m = Math.abs(c); return (m>1?m:'') + (c>0?'+':'−'); };

// =====================================================
//  Verified ion data (from the content workflow)
// =====================================================
const CATIONS = {
  'Hydrogen':{s:'H',c:1,t:'main'}, 'Lithium':{s:'Li',c:1,t:'main'}, 'Sodium':{s:'Na',c:1,t:'main'},
  'Potassium':{s:'K',c:1,t:'main'}, 'Silver':{s:'Ag',c:1,t:'main'}, 'Magnesium':{s:'Mg',c:2,t:'main'},
  'Calcium':{s:'Ca',c:2,t:'main'}, 'Barium':{s:'Ba',c:2,t:'main'}, 'Zinc':{s:'Zn',c:2,t:'main'}, 'Aluminum':{s:'Al',c:3,t:'main'},
  'Iron(II)':{s:'Fe',c:2,t:'transition'}, 'Iron(III)':{s:'Fe',c:3,t:'transition'},
  'Copper(I)':{s:'Cu',c:1,t:'transition'}, 'Copper(II)':{s:'Cu',c:2,t:'transition'},
  'Lead(II)':{s:'Pb',c:2,t:'transition'}, 'Lead(IV)':{s:'Pb',c:4,t:'transition'},
  'Tin(II)':{s:'Sn',c:2,t:'transition'}, 'Tin(IV)':{s:'Sn',c:4,t:'transition'},
  'Chromium(III)':{s:'Cr',c:3,t:'transition'}, 'Manganese(II)':{s:'Mn',c:2,t:'transition'},
  'Cobalt(II)':{s:'Co',c:2,t:'transition'}, 'Nickel(II)':{s:'Ni',c:2,t:'transition'}
};
const ANIONS = {
  'Fluoride':{s:'F',c:-1}, 'Chloride':{s:'Cl',c:-1}, 'Bromide':{s:'Br',c:-1}, 'Iodide':{s:'I',c:-1},
  'Oxide':{s:'O',c:-2}, 'Sulfide':{s:'S',c:-2}, 'Nitride':{s:'N',c:-3}, 'Phosphide':{s:'P',c:-3}
};
const POLY = {
  'Ammonium':{f:'NH4',c:1,cat:true}, 'Hydroxide':{f:'OH',c:-1}, 'Nitrate':{f:'NO3',c:-1}, 'Nitrite':{f:'NO2',c:-1},
  'Acetate':{f:'C2H3O2',c:-1}, 'Bicarbonate':{f:'HCO3',c:-1}, 'Cyanide':{f:'CN',c:-1}, 'Permanganate':{f:'MnO4',c:-1},
  'Carbonate':{f:'CO3',c:-2}, 'Sulfate':{f:'SO4',c:-2}, 'Sulfite':{f:'SO3',c:-2}, 'Chromate':{f:'CrO4',c:-2},
  'Dichromate':{f:'Cr2O7',c:-2}, 'Phosphate':{f:'PO4',c:-3}
};

// resolve a named ion (cation or anion, monatomic or polyatomic) to a uniform shape
function ion(name) {
  if (CATIONS[name]) return { name, token: CATIONS[name].s, charge: CATIONS[name].c, poly:false, roman: CATIONS[name].t==='transition' };
  if (ANIONS[name]) return { name, token: ANIONS[name].s, charge: ANIONS[name].c, poly:false };
  if (POLY[name]) return { name, token: POLY[name].f, charge: POLY[name].c, poly:true };
  return null;
}

// =====================================================
//  The solver, the app's single source of truth.
//  Computes lowest-terms counts via LCM internally, which matches
//  the taught method (switch + reduce): CaO always, never Ca2O2.
// =====================================================
function gcd(a,b){ return b ? gcd(b, a%b) : a; }
function lcm(a,b){ return a*b / gcd(a,b); }
function unitStr(io, n) {
  if (n === 1) return io.token;               // count 1: no subscript, no parentheses
  return io.poly ? `(${io.token})${n}` : `${io.token}${n}`;
}
function solve(catName, anName) {
  const cat = ion(catName), an = ion(anName);
  const a = Math.abs(cat.charge), b = Math.abs(an.charge);
  const L = lcm(a, b), nc = L / a, na = L / b;
  // raw = the switched-but-not-yet-reduced formula (only differs when charges share a factor)
  return { cat, an, a, b, L, nc, na, g: gcd(a, b), raw: unitStr(cat, b) + unitStr(an, a), formula: unitStr(cat, nc) + unitStr(an, na) };
}
// one phrasing for "this number becomes that ion's subscript", shared by the machine and the reveal
function subPhrase(io, n) {
  if (n === 1) return `the 1 on ${io.token} is never written`;
  if (io.poly) return `the ${n} goes outside parentheses: (${io.token})${n}`;
  return `the ${n} becomes ${io.token}'s subscript`;
}
const norm = s => (s||'').replace(/[₀-₉]/g, d => String('₀₁₂₃₄₅₆₇₈₉'.indexOf(d))).replace(/\s+/g,'').replace(/−/g,'-');

function assessFormula(value, catName, anName) {
  const v=norm(value), r=solve(catName,anName);
  if (!v) return {state:'no',message:'Enter a formula first.'};
  if (v===r.formula) return {state:'ok',message:'Correct. That is the reduced formula.'};
  if (v.toLowerCase()===r.formula.toLowerCase()) return {state:'no',message:'Check capitalization: element symbols are case-sensitive.'};
  if (r.g>1 && v===r.raw) return {state:'no',message:'Reduce if needed: both subscripts still divide by the same number.'};
  if (r.a===r.b && r.a>1 && v===unitStr(r.cat,r.a)+unitStr(r.an,r.b)) return {state:'no',message:'Same numbers drop, they never switch. Write one of each ion with no subscripts.'};
  if ((r.cat.poly && r.nc>1)||(r.an.poly && r.na>1)) return {state:'no',message:'Keep each polyatomic ion whole, and put it in parentheses only when you need more than one of it.'};
  return {state:'no',message:'Check each charge, then run the 4 moves: numbers with no signs, drop or switch, reduce if needed.'};
}

// build the copy-down worked solution for any compound
function workedFor(catName, anName) {
  const r = solve(catName, anName);
  const cc = chg(r.cat.charge), ac = chg(r.an.charge);
  const catShow = r.cat.poly ? r.cat.token : r.cat.token;
  const romanNote = r.cat.roman ? ` The Roman numeral in the name tells you ${r.cat.name.replace(/\(.*\)/, '').trim()} is ${r.cat.token}${cc}.` : '';
  const move3 = (r.a === r.b)
    ? `3) Same numbers (${r.a} and ${r.b}), drop them: one ${r.cat.token}, one ${r.an.token}.`
    : `3) Different, switch them: ${subPhrase(r.cat, r.b)}; ${subPhrase(r.an, r.a)}.`;
  const move4 = (r.a !== r.b && r.g > 1)
    ? `4) Reduce: both subscripts divide by ${r.g}, so ${r.raw} becomes ${r.formula}.`
    : `4) Reduce if needed: ${r.formula} is already reduced.`;
  return [
    `1) Write each ion + its charge: ${r.cat.token}${cc} and ${r.an.token}${ac}.${romanNote}`,
    `2) Numbers, no signs: ${r.a} and ${r.b}.`,
    move3,
    move4,
    `Formula: ${r.formula}.`

}

// =====================================================
//  Canvas atom / ion drawing
// =====================================================
const IONC = { pos:{fill:'#d97706',lite:'#fbbf24',glow:'217,119,6'}, neg:{fill:'#0d9488',lite:'#5eead4',glow:'13,148,136'} };
function drawIonBall(ctx, x, y, label, sign, r) {
  const C = sign>0 ? IONC.pos : IONC.neg;
  const gg = ctx.createRadialGradient(x,y,0,x,y,r+8); gg.addColorStop(0,`rgba(${C.glow},0.28)`); gg.addColorStop(1,`rgba(${C.glow},0)`);
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r+8,0,Math.PI*2); ctx.fill();
  const g = ctx.createRadialGradient(x-r*0.35,y-r*0.35,1,x,y,r); g.addColorStop(0,C.lite); g.addColorStop(1,C.fill);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`700 ${Math.round(r*0.72)}px Roboto Mono, monospace`; ctx.fillText(label, x-(label.length>1?r*0.14:0), y);
  ctx.font=`700 ${Math.round(r*0.55)}px Roboto Mono, monospace`; ctx.fillText(sign>0?'+':'−', x + r*0.6 + (label.length>1?r*0.2:0), y - r*0.5);
}
function drawBulb(ctx, x, y, b) {
  b = Math.max(0, Math.min(1, b));
  if (b > 0.03) { const gr=ctx.createRadialGradient(x,y,0,x,y,44*b+8); gr.addColorStop(0,`rgba(251,191,36,${0.6*b})`); gr.addColorStop(1,'rgba(251,191,36,0)'); ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,44*b+8,0,Math.PI*2); ctx.fill(); }

  ctx.beginPath(); ctx.arc(x,y,15,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#78716c'; roundRect(ctx,x-6,y+12,12,9,2); ctx.fill();
  ctx.strokeStyle=b>0.05?`rgb(255,${Math.round(170+70*b)},50)`:'#cbc4b8'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-5,y+2); ctx.lineTo(x-2,y-5); ctx.lineTo(x+2,y+1); ctx.lineTo(x+5,y-5); ctx.stroke();
}
// Bohr atom: nucleus symbol + shells of electrons
const BOHR_R = [0, 22, 40, 58];
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
// Buzzing electron cloud (same feel as the Atomic Structure app): electrons wander
// on a random walk with radial breathing and jitter, leaving a fading trail, NOT fixed orbits.
function buzzCloud(nShells) {
  const shells = Array.from({ length: nShells }, () => []);
  return {
    shells,
    occ() { return shells.reduce((m, a, i) => a.length ? i : m, -1); },
    setCounts(counts) {
      for (let i = 0; i < shells.length; i++) {
        const want = counts[i] || 0, arr = shells[i];
        while (arr.length < want) arr.push({ ang: Math.random()*Math.PI*2, av: (Math.random()-0.5)*0.03, rPhase: Math.random()*Math.PI*2, rSpeed: 0.6+Math.random()*0.9, jx: 0, jy: 0, trail: [] });
        while (arr.length > want) arr.pop();
      }
    },
    update(dt) {
      if(reducedMotion.matches) return;
      const f = dt * 0.06;
      for (let i = 0; i < shells.length; i++) {
        const dir = (i % 2) ? -1 : 1, buzz = 0.5 + i * 0.75;
        for (const p of shells[i]) {
          p.av += (Math.random()-0.5) * (0.010 + i*0.006);
          p.av = Math.max(-0.07, Math.min(0.07, p.av)) * 0.94;
          p.ang += p.av + dir * 0.0009 * f;
          p.rPhase += 0.004 * p.rSpeed * f;
          p.jx = (p.jx + (Math.random()-0.5)*buzz) * 0.82;
          p.jy = (p.jy + (Math.random()-0.5)*buzz) * 0.82;
        }
      }
    },
    draw(ctx, cx, cy, opts = {}) {
      const occ = this.occ();
      for (let i = 0; i < shells.length; i++) {
        if (!shells[i].length) continue;
        const r = BOHR_R[i+1], isVal = opts.valence && i === occ;
        ctx.strokeStyle = isVal ? 'rgba(168,85,247,0.42)' : 'rgba(99,102,241,0.28)';
        ctx.setLineDash([3,6]); ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
        const glow = isVal ? '168,85,247' : '129,140,248', core = isVal ? '#a855f7' : '#6366f1';
        for (const p of shells[i]) {
          const rr = r + Math.sin(p.rPhase) * (3 + i*3);
          const ex = cx + Math.cos(p.ang)*rr + p.jx, ey = cy + Math.sin(p.ang)*rr + p.jy;
          p.trail.unshift({ x: ex, y: ey }); if (p.trail.length > 5) p.trail.pop();
          for (let k = p.trail.length-1; k > 0; k--) { const tp = p.trail[k], a = (1 - k/p.trail.length) * 0.2;
            ctx.fillStyle = `rgba(${glow},${a})`; ctx.beginPath(); ctx.arc(tp.x, tp.y, 3.4, 0, Math.PI*2); ctx.fill(); }
          const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 9); g.addColorStop(0, `rgba(${glow},0.5)`); g.addColorStop(1, `rgba(${glow},0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 9, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = core; ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI*2); ctx.fill();
        }
      }
    }
  };
}
function drawNuc(ctx, cx, cy, sym, badge, badgeCol, outerR) {
  const ng = ctx.createRadialGradient(cx-4, cy-4, 2, cx, cy, 18); ng.addColorStop(0, '#c7d2fe'); ng.addColorStop(1, '#818cf8');
  ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1e1b4b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 14px Roboto Serif, serif'; ctx.fillText(sym, cx, cy);
  if (badge) { const or = outerR || 54; ctx.fillStyle = badgeCol || '#d97706'; ctx.font = '700 15px Roboto Mono'; ctx.textAlign = 'left'; ctx.fillText(badge, cx + or + 8, cy - or - 2); }
}
function driftFree(p, dt, bounds, pullX) {
  p.vx=(p.vx||0)+(Math.random()-0.5)*0.26; p.vy=(p.vy||0)+(Math.random()-0.5)*0.26;
  if (pullX!=null) p.vx += (pullX-p.x)*0.0011;
  p.vx*=0.93; p.vy*=0.93; p.x+=p.vx*dt*0.12; p.y+=p.vy*dt*0.12;
  const [l,r,t,b]=bounds;
  if(p.x<l){p.x=l;p.vx=Math.abs(p.vx)*0.6;} if(p.x>r){p.x=r;p.vx=-Math.abs(p.vx)*0.6;}
  if(p.y<t){p.y=t;p.vy=Math.abs(p.vy)*0.6;} if(p.y>b){p.y=b;p.vy=-Math.abs(p.vy)*0.6;}
}

let currentTick = null, lastTs = null;
function loop(ts){ if(lastTs==null) lastTs=ts; const dt=Math.min(50,ts-lastTs); lastTs=ts; if(currentTick) currentTick(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// =====================================================
//  Shared UI: the animated "method machine" (Steps 5-9)
// =====================================================
function methodMachine(host, catName, anName, opts={}) {
  const scene=current, task='method:'+catName+'|'+anName;
  requireTask(task, catName+' '+anName.toLowerCase()+' - reveal all four moves and the formula');
  (opts.compare||[]).forEach(([c,a])=>requireTask('method:'+c+'|'+a,c+' '+a.toLowerCase()+' - reveal all four moves and the formula'));
  host.innerHTML = '';
  const r = solve(catName, anName);
  const machine = el('div',{class:'machine'});
  const nameEl = el('div',{class:'m-name',html:`<span class="cat-w">${catName}</span> <span class="an-w">${anName.toLowerCase()}</span>`});
  const movesWrap = el('div',{style:'display:flex;flex-direction:column;gap:12px'});
  machine.append(nameEl, movesWrap);
  host.append(machine);
  const cc = chg(r.cat.charge), ac = chg(r.an.charge);
  const moves = [
    { lab:'Move 1 · Write each ion + its charge', html:
      `<span class="ion-chip cat">${fmt(r.cat.token)}<sup>${cc}</sup></span> and <span class="ion-chip an">${fmt(r.an.token)}<sup>${ac}</sup></span>` +
      (r.cat.roman ? `<div style="font-size:12.5px;color:#b45309;margin-top:6px">The Roman numeral tells you ${r.cat.token} is ${cc}.</div>`:'') +
      ((r.cat.poly || r.an.poly) ? `<div style="font-size:12.5px;color:var(--indigo);margin-top:6px">From your polyatomic ion chart: ${[r.cat,r.an].filter(x=>x.poly).map(x=>`${x.name.toLowerCase()} is ${fmt(x.token)}<sup>${chg(x.charge)}</sup>`).join(', ')}. Copy the formula and charge exactly as the chart shows them.</div>`:'') },
    { lab:'Move 2 · Numbers, no signs', html:`<b style="font-family:var(--font-mono);font-size:18px">${r.a}</b> and <b style="font-family:var(--font-mono);font-size:18px">${r.b}</b>` },
    { lab:'Move 3 · Same? Drop them. Different? Switch them', html: r.a===r.b
      ? `${r.a} = ${r.b} → <span class="lcm-badge">drop them</span>, one ${r.cat.token}, one ${r.an.token}`
      : `<span class="lcm-badge">switch</span>, ${subPhrase(r.cat, r.b)}, ${subPhrase(r.an, r.a)}: ${fmt(r.raw)}` },
    { lab:'Move 4 · Reduce if needed', html: (r.a!==r.b && r.g>1)
      ? `divide both by ${r.g}: ${fmt(r.raw)} → <b>${fmt(r.formula)}</b>`
      : `${fmt(r.formula)}, already reduced` }
  ];
  let shown = 0;
  const finalWrap = el('div');
  const nextBtn = el('button',{class:'primary',html:'Next move '+ICON.right});
  const controls = el('div',{class:'tool-row',style:'margin-top:2px'},[nextBtn]);
  host.append(controls, finalWrap);
  function showFinal(){
    finalWrap.innerHTML='';
    const box = el('div',{class:'m-final'},[
      el('div',{class:'big formula',html:fmt(r.formula)}),
      el('div',{class:'ok',html:'Check: total positive charge equals total negative charge'})
    ]);

// ---- Step 4: Bohr transfer (model + draw) ----
scenes.push({
  seeLabel: 'Electron transfer',
  heading: 'Step 4: The Bohr Reason - Who Loses, Who Gains',
  notes: "<strong>Metals lose, nonmetals gain.</strong> Every atom “wants” a full outer shell (an octet = stability). A metal has only a few outer electrons, so it <strong>loses</strong> them and becomes a positive <strong>cation</strong>. A nonmetal is nearly full, so it <strong>gains</strong> electrons and becomes a negative <strong>anion</strong>. The number of electrons moved is exactly the <strong>size of the charge</strong>.",
  notebook: "<strong>Draw the transfer yourself.</strong> Draw the two atoms before, an <strong>arrow</strong> for each electron that moves, and the two ions after with their charges labeled. Then predict: chlorine has 7 outer electrons, will it <strong>lose 7</strong> or <strong>gain 1</strong>, and why is that easier?",
  build(stage) {
    const scene=current;
    const { ctx } = makeCanvas(stage, 520, 300);
    const pairs = { 'Na + Cl':{a:'Na',sa:[2,8,1],b:'Cl',sb:[2,8,7],moved:1,ca:'+',cb:'−'},
                    'Mg + O':{a:'Mg',sa:[2,8,2],b:'O',sb:[2,6],moved:2,ca:'2+',cb:'2−'} };
    Object.keys(pairs).forEach(k=>requireTask('transfer:'+k,'Complete the '+k+' electron transfer'));
    let key='Na + Cl', phase='idle', t=0, moved=0;
    const chips = el('div',{class:'tool-row'}, Object.keys(pairs).map(k=>el('button',{class:'chip'+(k===key?' active':''),'data-k':k,
      onclick(){ key=k; phase='idle'; t=0; moved=0; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.k===k)); setStatus(); }},k)));
    const status = el('div',{class:'status-line'});
    function setStatus(){ const p=pairs[key]; status.innerHTML = phase==='done'
      ? `${p.a} lost ${p.moved} → <strong style="color:#d97706">${p.a}<sup style="font-size:0.68em">${p.ca}</sup></strong>, ${p.b} gained ${p.moved} → <strong style="color:#0d9488">${p.b}<sup style="font-size:0.68em">${p.cb}</sup></strong>. Full octets, stable.`
      : `${p.a} has ${p.sa[p.sa.length-1]} outer electron(s); ${p.b} needs ${8-p.sb[p.sb.length-1]} to fill its shell.`; }
    const btn = el('button',{class:'primary',html:'Transfer the electron(s) '+ICON.right});
    btn.addEventListener('click',()=>{ if(phase==='idle'){ phase='move'; t=0; moved=0; } });
    const NaX=145, ClX=355, cy=142;
    const A = buzzCloud(3), B = buzzCloud(3);
    currentTick = (dt) => {
      ctx.clearRect(0,0,520,300); const p=pairs[key];
      if(phase==='move'){ t+=dt/900; if(t>=1){ moved++; t=0; if(moved>=p.moved){ phase='done'; setStatus(); finishTask('transfer:'+key,scene); } } }
      const done=phase==='done';
      const aInner=p.sa.slice(0,-1), origA=p.sa[p.sa.length-1];
      const bInner=p.sb.slice(0,-1), origB=p.sb[p.sb.length-1];

      const aVal = Math.max(0, origA - moved - inFlight);           // valence electrons lift out one at a time
      const bVal = origB + (done ? p.moved : moved);                // nonmetal fills as each arrives
      A.setCounts(aInner.concat([aVal])); B.setCounts(bInner.concat([bVal]));
      A.update(dt); B.update(dt);
      A.draw(ctx,NaX,cy,{valence:true}); B.draw(ctx,ClX,cy,{valence:true});
      drawNuc(ctx,NaX,cy,p.a, done?p.ca:'', '#d97706', BOHR_R[A.occ()+1]);
      drawNuc(ctx,ClX,cy,p.b, done?p.cb:'', '#0d9488', BOHR_R[B.occ()+1]);
      if(phase==='move'){ const sx=NaX+BOHR_R[p.sa.length], tx=ClX-BOHR_R[p.sb.length]-2;
        const ex=sx+(tx-sx)*t, ey=cy-Math.sin(t*Math.PI)*32;
        const g=ctx.createRadialGradient(ex,ey,0,ex,ey,12); g.addColorStop(0,'rgba(168,85,247,0.6)'); g.addColorStop(1,'rgba(168,85,247,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,12,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#a855f7'; ctx.beginPath(); ctx.arc(ex,ey,4.5,0,Math.PI*2); ctx.fill(); }
      ctx.textAlign='center'; ctx.font='700 10px Roboto Mono';

      btn.disabled = phase!=='idle';
    };
    setStatus();
    stage.append(chips, el('div',{class:'tool-row',style:'margin-top:2px'},[btn]), status,
      el('div',{class:'caption'},'Try Mg + O to see two electrons move.'));
  }
});

// ---- Step 5: Meet the ions & charges (mini periodic table) ----
scenes.push({
  seeLabel: 'Periodic table',
  heading: 'Step 5: Meet the Ions and Their Charges',
  notes: "<strong>Position tells you the charge.</strong> On the periodic table an element's <strong>column (group)</strong> sets its ion charge: <strong>Group 1 = 1+, Group 2 = 2+, Al = 3+; Group 16 = 2−, Group 17 = 1−</strong>. <strong>Transition metals</strong> vary, the <strong>Roman numeral</strong> in the name gives the charge. <strong>Polyatomic ions</strong> aren't on the table; find them on your reference sheet.",
  notebook: "Find <strong>Iron</strong> on the table and tap it. <strong>Predict and write</strong> the charge of <strong>iron</strong> and of <strong>oxide</strong>. Then jot the rule: a main-group ion's charge comes from its <strong>column</strong>; a transition metal's comes from the <strong>Roman numeral</strong> in its name.",
  build(stage) {
    // periods 1-4 (the pattern + all our transition metals); heavier ions sit lower in the same columns (appendix)
    const PT = [
      ['H',1,1],['He',18,1],
      ['Li',1,2],['Be',2,2],['B',13,2],['C',14,2],['N',15,2],['O',16,2],['F',17,2],['Ne',18,2],
      ['Na',1,3],['Mg',2,3],['Al',13,3],['Si',14,3],['P',15,3],['S',16,3],['Cl',17,3],['Ar',18,3],
      ['K',1,4],['Ca',2,4],['Sc',3,4],['Ti',4,4],['V',5,4],['Cr',6,4],['Mn',7,4],['Fe',8,4],['Co',9,4],['Ni',10,4],['Cu',11,4],['Zn',12,4],['Ga',13,4],['Ge',14,4],['As',15,4],['Se',16,4],['Br',17,4],['Kr',18,4]
    ];
    const NAME = {Li:'Lithium',Na:'Sodium',K:'Potassium',Mg:'Magnesium',Ca:'Calcium',Al:'Aluminum',N:'Nitrogen',O:'Oxygen',S:'Sulfur',F:'Fluorine',Cl:'Chlorine',Br:'Bromine',Cr:'Chromium',Mn:'Manganese',Fe:'Iron',Co:'Cobalt',Ni:'Nickel',Cu:'Copper',Zn:'Zinc'};
    const HI = new Set(Object.keys(NAME));
    HI.forEach(sym=>requireTask('ion:'+sym,'Reveal '+NAME[sym]+"'s charge"));
    const groupCharge = g => ({1:1,2:2,13:3,15:-3,16:-2,17:-1,18:0})[g];
    const catFor = g => (g>=3&&g<=12)?'tr':(g===18)?'noble':((groupCharge(g)>0)?'cat':(groupCharge(g)<0)?'an':'');
    const chargeFor = (sym,g) => (g>=3&&g<=12) ? (sym==='Zn'?2:null) : groupCharge(g);

    const read = el('div',{class:'status-line pt-read'});
    function reveal(sym,g,cell){
      finishTask('ion:'+sym);
      const cat=catFor(g), c=chargeFor(sym,g), nm=NAME[sym]||sym;
      cell.classList.add('on');
      cell.querySelector('.pt-chg').innerHTML = (cat==='tr'&&c===null)?'?':chg(c);
      if (cat==='tr' && c===null) read.innerHTML = `<strong style="color:#7c3aed">${nm} (${sym})</strong>, transition metal · charge comes from the <strong>Roman numeral</strong> in the name (Iron(III) = Fe<sup>3+</sup>).`;

  }
});

// ---- Practice runner (shared) ----
function practiceStep(stage, items) {
  const scene=current, key='practice:'+scene;
  const saved=WORK[key];
  const state=saved && typeof saved==='object' ? saved : {index:0,questions:{}};
  state.questions=state.questions && typeof state.questions==='object' ? state.questions : {};
  state.index=Number.isInteger(state.index) ? Math.max(0,Math.min(items.length-1,state.index)) : 0;
  // Migrate answers from the old ten-input layout without clearing existing work.
  items.forEach((it,i)=>{
    if (!state.questions[i]) state.questions[i]={answer:typeof WORK[scene+':text:'+i]==='string' ? WORK[scene+':text:'+i] : '',checked:false,revealed:false};
    if(state.questions[i].revealed)state.questions[i].solutionSeen=true;
    requireTask('answer:'+i,'Check the correct formula for '+it.name);
    requireTask('solution:'+i,'Open the solution for '+it.name);
  });
  WORK[key]=state;
  const panel=el('div'); stage.append(panel);
  function save(){ persistWork(); }
  function draw(focus=false){
    panel.innerHTML='';
    const i=state.index,it=items[i],q=state.questions[i],r=solve(it.cat,it.an);
    const counter=el('div',{class:'practice-counter'},`Question ${i+1} of ${items.length}`);
    const question=el('h3',{class:'practice-question',id:'practiceQuestion'},it.name);
    const input=el('input',{id:'practiceFormula',class:'practice-input',type:'text',placeholder:'e.g. NaCl',autocapitalize:'off',autocomplete:'off',spellcheck:'false','data-managed':'true','aria-describedby':'formulaHint practiceFeedback'});
    input.value=q.answer || '';
    const msg=el('div',{class:'practice-feedback',id:'practiceFeedback',role:'status','aria-live':'polite'});
    const check=el('button',{class:'primary'},'Check formula');
    const reveal=el('button',{'aria-controls':'practiceSolution','aria-expanded':q.revealed?'true':'false'},q.revealed?'Hide solution':'Show solution');
    const solution=el('div',{class:'reveal-content practice-solution',id:'practiceSolution'});
    solution.hidden=!q.revealed;
    const steps=[
      `<span class="ion-chip cat">${fmt(r.cat.token)}<sup>${chg(r.cat.charge)}</sup></span> + <span class="ion-chip an">${fmt(r.an.token)}<sup>${chg(r.an.charge)}</sup></span>`,
      `Numbers, no signs: <strong>${r.a}</strong> and <strong>${r.b}</strong>.`,
      r.a===r.b ? `Same numbers, so they drop: one ${fmt(r.cat.token)}, one ${fmt(r.an.token)}.` : `Different, so switch them: ${fmt(r.raw)}.`,
      r.g>1 && r.a!==r.b ? `Reduce: both subscripts divide by ${r.g}, so ${fmt(r.raw)} becomes ${fmt(r.formula)}.` : `Reduce if needed: ${fmt(r.formula)} is already reduced.`
    ];
    solution.append(el('ol',{},steps.map(html=>el('li',{html}))),el('span',{class:'formula',html:fmt(r.formula)}));
    const fill=el('div',{class:'pb-fill'}),progress=el('div',{class:'pb-text',role:'status'});
    const next=el('button',{},i===items.length-1?'Finish practice':'Next question');
    function updateProgress(){
      const correct=items.filter((it,j)=>{const x=state.questions[j];return x.checked && norm(x.answer)===solve(it.cat,it.an).formula;}).length;
      fill.style.width=(correct/items.length*100)+'%';
      progress.textContent=`${correct} of ${items.length} correct · Saved on this device`;
      progress.classList.toggle('complete',correct===items.length);
      items.forEach((it,j)=>{
        const x=state.questions[j];
        setTask('answer:'+j,!!x.checked && norm(x.answer)===solve(it.cat,it.an).formula,scene);
        setTask('solution:'+j,!!x.solutionSeen,scene);
      });
      next.disabled=!ADMIN && (!(q.checked && norm(q.answer)===r.formula && q.solutionSeen) || (i===items.length-1 && !canAdvance()));
    }
    function feedback(){
      const result=q.checked ? assessFormula(q.answer,it.cat,it.an) : {state:'',message:''};
      msg.className='practice-feedback '+result.state; msg.textContent=result.message;
      input.setAttribute('aria-invalid',result.state==='no'?'true':'false');
      updateProgress();
    }
    input.addEventListener('input',()=>{q.answer=input.value;q.checked=false;save();feedback();});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check.click();}});
    check.addEventListener('click',()=>{q.answer=input.value;q.checked=true;save();feedback();});
    reveal.addEventListener('click',()=>{q.revealed=!q.revealed;if(q.revealed)q.solutionSeen=true;solution.hidden=!q.revealed;reveal.textContent=q.revealed?'Hide solution':'Show solution';reveal.setAttribute('aria-expanded',String(q.revealed));save();updateProgress();});
    const previous=el('button',{disabled:i===0},'Previous question');
    // el() writes attributes literally; remove disabled when the control is usable.
    if(i>0) previous.removeAttribute('disabled');
    previous.addEventListener('click',()=>{state.index--;save();draw(true);});
    next.addEventListener('click',()=>{if(next.disabled)return;if(state.index<items.length-1){state.index++;save();draw(true);}else setScene(scene+1,true);});
    const syncNext=()=>{next.disabled=!ADMIN && (!(q.checked && norm(q.answer)===r.formula && q.solutionSeen)||(i===items.length-1 && !canAdvance()));};
    stage._syncPracticeNext=syncNext;
    panel.append(el('div',{class:'practice-top'},[counter]),question,
      el('label',{class:'practice-label',for:'practiceFormula'},'Your formula'),input,
      el('div',{class:'caption',id:'formulaHint',style:'text-align:left;margin-top:8px'},'Use digits or subscripts. Element symbols are case-sensitive.'),
      el('div',{class:'practice-actions'},[check,reveal]),msg,solution,
      el('div',{class:'practice-nav'},[previous,next]),el('div',{class:'pb-progress'},[el('div',{class:'pb-bar'},[fill]),progress]));
    feedback(); if(focus) input.focus({preventScroll:true});
  }
  draw();
}

  ['The four moves','<strong>1.</strong> Write each ion + its charge. <strong>2.</strong> Numbers, no signs. <strong>3.</strong> Same? Drop them. Different? Switch them, so each number becomes the other ion\'s subscript. <strong>4.</strong> Reduce if needed. Equal numbers drop, they never switch: calcium oxide is CaO, never Ca₂O₂.','Predict <strong>CaO or Ca₂O₂</strong>, then run the machine. Try tin(IV) oxide to watch Sn₂O₄ reduce to SnO₂.'],
  ['Binary compounds','<strong>Same 4 moves, new numbers.</strong> Magnesium chloride: 2 and 1 are different, switch them, MgCl₂. Aluminum oxide: 3 and 2, switch them, Al₂O₃. Calcium oxide: 2 and 2 are the same, drop them, CaO.','Write the ions, charges, and formula <strong>before</strong> running each example.'],
  ['Roman numerals','<strong>The Roman numeral gives the metal ion charge.</strong> Iron(II) is Fe²⁺; iron(III) is Fe³⁺. Read the charge off the numeral, then run the same 4 moves.','Predict <strong>iron(III) oxide</strong>, then compare it with iron(II) oxide.'],
  ['Keep the group together','<strong>Move 1 starts on your polyatomic ion chart.</strong> Look up the ion there and copy its formula and charge exactly, then treat it as one unit. Keep its internal subscripts unchanged. Add parentheses only when more than one unit is needed: Ca(NO₃)₂, but NaNO₃.','Predict how many <strong>nitrate units</strong> calcium needs, then check the formula.'],
  ['Binary practice','<strong>Same? Drop them. Different? Switch them. Then reduce if needed.</strong> These compounds use monatomic ions. Equal numbers drop: calcium oxide is CaO, never Ca₂O₂.','Write each formula <strong>before checking</strong>. Use the solution to explain any correction.'],
  ['Polyatomic practice','<strong>Keep each polyatomic ion whole.</strong> Run the same 4 moves with the ion as one unit, and add parentheses only when you need more than one of it.','Write each formula <strong>before checking</strong>. Explain when parentheses are needed.'],
  ['What questions do you still have?','<strong>Recap:</strong> write each ion and its charge, take the numbers with no signs, drop or switch, reduce if needed, and keep polyatomic ions whole.','Write the questions you still have in your notebook, then add them here.']
];
const stageEl=$('#stage'), stageLabel=$('#stageLabel'), stepHeadingEl=$('#stepHeading'),
  notesEl=$('#notes'), notebookTextEl=$('#notebookText'), stepIndicator=$('#stepIndicator'),
  stepNumEl=$('#stepNum'), stepTitleEl=$('#stepTitle'), progressFill=$('#progressFill'),
  prevBtn=$('#prevBtn'), nextBtn=$('#nextBtn'), resetBtn=$('#resetBtn');
let current = 0;
let requiredTasks=new Map();
// Teacher admin link (?admin=ionic-ramsey): every step gate is off. ?admin=0 turns it back off.
const ADMIN=(()=>{try{const a=new URLSearchParams(location.search).get('admin');
  if(a==='ionic-ramsey')localStorage.setItem('ionic-formulas-admin','1');
  if(a==='0')localStorage.removeItem('ionic-formulas-admin');
  return localStorage.getItem('ionic-formulas-admin')==='1';}catch(e){return false;}})();
const notebookDone=$('#notebookDone'),gateStatus=$('#gateStatus');
function gateFor(scene=current){
  const key='gate:v1:'+scene;
  if(!WORK[key] || typeof WORK[key]!=='object') WORK[key]={tasks:{},notebook:false,complete:false};
  if(!WORK[key].tasks || typeof WORK[key].tasks!=='object') WORK[key].tasks={};
  return WORK[key];
}
function canAdvance(){ if(ADMIN)return true; const g=gateFor(); return !!g.notebook && [...requiredTasks.keys()].every(id=>g.tasks[id]===true); }
function updateGate(){
  const g=gateFor(),missing=[...requiredTasks].filter(([id])=>g.tasks[id]!==true);
  g.complete=canAdvance();
  notebookDone.checked=!!g.notebook;
  nextBtn.disabled=current===scenes.length-1 || !g.complete;
  nextBtn.setAttribute('aria-describedby','gateStatus');
  gateStatus.textContent=ADMIN?'Admin view: steps are unlocked.':missing.length?`Still to do (${missing.length}): ${missing[0][1]}.`:!g.notebook?'Finish your notes and notebook task, then confirm above.':'Step complete.';
  if(stageEl._syncPracticeNext)stageEl._syncPracticeNext();
}
function requireTask(id,label){ requiredTasks.set(id,label); updateGate(); }
function setTask(id,done,scene=current){
  const g=gateFor(scene);
  if(g.tasks[id]===done)return;
  g.tasks[id]=done;
  if(scene===current)updateGate();
  persistWork();
}
function finishTask(id,scene=current){setTask(id,true,scene);}
notebookDone.addEventListener('change',()=>{gateFor().notebook=notebookDone.checked;updateGate();persistWork();});
const pad2 = n => n < 10 ? '0'+n : ''+n;
function setScene(i,focus=false) {
  if(i>current && !canAdvance())return;
  current = i; currentTick = null;
  requiredTasks=new Map();
  stageEl._syncPracticeNext=null;
  if (window._qUnsub) { try { window._qUnsub(); } catch(e){} window._qUnsub = null; }
  const s = scenes[i];
  stageEl.innerHTML = '';
  const shortTitle = s.heading.replace(/^Step \d+:\s*/, '');
  stageLabel.textContent = s.seeLabel || 'What you see';
  const copy=CLEAN_COPY[i];
  stepHeadingEl.textContent = copy?copy[0]:shortTitle.replace(/\s*[ - -]\s*/g,' - ');
  stepNumEl.textContent = 'Step ' + pad2(i+1);
  stepTitleEl.textContent = shortTitle;
  notesEl.innerHTML = copy?copy[1]:s.notes; notebookTextEl.innerHTML = copy?copy[2]:s.notebook;
  stepIndicator.textContent = `${pad2(i+1)} / ${pad2(scenes.length)}`;
  progressFill.style.width = ((i+1)/scenes.length*100) + '%';
  prevBtn.disabled = i === 0; nextBtn.disabled = i === scenes.length-1;
  nextBtn.innerHTML = i === scenes.length-1 ? 'Done' : 'Next ' + ICON.right;
  s.build(stageEl);
  restoreWork(i);
  updateGate();
  WORK.lastScene=i; persistWork();
  window.scrollTo({ top: 0, behavior: 'instant' });
  if(focus) stepHeadingEl.focus({preventScroll:true});
}
prevBtn.addEventListener('click', () => { if (current>0) setScene(current-1,true); });
nextBtn.addEventListener('click', () => { if (current<scenes.length-1 && canAdvance()) setScene(current+1,true); });
resetBtn.addEventListener('click', () => setScene(0,true));
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowRight' && current<scenes.length-1) {e.preventDefault();if(canAdvance())setScene(current+1,true);}
  if (e.key === 'ArrowLeft' && current>0) {e.preventDefault();setScene(current-1,true);}
});

// ===== Student work persistence =====
// Rebuilding a scene wipes anything typed into it, so every input, textarea,
// and select is keyed by scene + position and restored on re-entry. Saved to
// localStorage so a page reload keeps student work too.
const WORK_KEY = 'ionic-formulas-student-work';
let WORK = {};
try { const saved=JSON.parse(localStorage.getItem(WORK_KEY)); WORK=saved && typeof saved==='object' && !Array.isArray(saved)?saved:{}; } catch(e) { WORK = {}; }
function persistWork(){ try { localStorage.setItem(WORK_KEY, JSON.stringify(WORK)); } catch(e){ const p=stageEl.querySelector('.pb-text');if(p)p.textContent='Storage unavailable. Keep your answers in your notebook.'; } }
function workFields(){ return Array.from(stageEl.querySelectorAll('input, textarea, select')).filter(f => f.type !== 'password' && f.type !== 'file' && !f.hasAttribute('data-managed')); }
function workKey(scene, f, idx){ return scene + ':' + (f.type || f.tagName.toLowerCase()) + ':' + idx; }
function restoreWork(scene){
  workFields().forEach((f, idx) => {
    const k = workKey(scene, f, idx);
    if (!(k in WORK)) return;
    const v = WORK[k];
    if (f.type === 'checkbox' || f.type === 'radio') {
      if (f.checked !== v) { f.checked = v; f.dispatchEvent(new Event('change', { bubbles: true })); }
    } else if (String(f.value) !== String(v)) {
      f.value = v;
      f.dispatchEvent(new Event('input', { bubbles: true }));
      f.dispatchEvent(new Event('change', { bubbles: true }));
    }
  });
}
function recordWork(e){
  const f = e.target;
  if (!f || !f.matches || !f.matches('input, textarea, select')) return;
  if (f.type === 'password' || f.type === 'file') return;
  const idx = workFields().indexOf(f);
  if (idx < 0) return;
  WORK[workKey(current, f, idx)] = (f.type === 'checkbox' || f.type === 'radio') ? f.checked : f.value;
  persistWork();
}
stageEl.addEventListener('input', recordWork);
stageEl.addEventListener('change', recordWork);

// Resume only as far as the first unfinished step, including after an old build.
const requestedScene=Number.isInteger(WORK.lastScene)?Math.max(0,Math.min(scenes.length-1,WORK.lastScene)):0;
let resumeScene=0;
while(resumeScene<requestedScene && (ADMIN || gateFor(resumeScene).complete===true))resumeScene++;
current=resumeScene;
setScene(resumeScene);
</script>
<script type="module">
const firebaseConfig = { apiKey:"PASTE_FIREBASE_apiKey", authDomain:"PASTE_FIREBASE_authDomain", projectId:"PASTE_FIREBASE_projectId", appId:"PASTE_FIREBASE_appId" };
const configured = !JSON.stringify(firebaseConfig).includes('PASTE_');
const listeners = {}, key = a => 'classq:' + a;
const readLocal = a => { try { return JSON.parse(localStorage.getItem(key(a)) || '[]'); } catch(e){ return []; } };
const notifyLocal = a => (listeners[a]||[]).forEach(cb => cb(readLocal(a)));
function setLocal(){
  window.ClassQ = { mode:'demo',
    async submit(p){ const r={app:p.app,name:p.name||'',klass:p.klass||'',questions:p.questions||[],created:Date.now()}; const arr=readLocal(r.app); arr.unshift(r); localStorage.setItem(key(r.app), JSON.stringify(arr.slice(0,300))); notifyLocal(r.app); },
    subscribe(a,cb){ (listeners[a]=listeners[a]||[]).push(cb); cb(readLocal(a)); return ()=>{ listeners[a]=(listeners[a]||[]).filter(x=>x!==cb); }; },
    async clear(a){ localStorage.removeItem(key(a)); notifyLocal(a); } };
}
async function init(){
  if (!configured) { setLocal(); }
  else { try {
      const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
      window.ClassQ = { mode:'live',
        async submit(p){ await fs.addDoc(fs.collection(db,'questions'), {app:p.app,name:p.name||'',klass:p.klass||'',questions:p.questions||[],created:Date.now()}); },
        subscribe(a,cb){ const qy=fs.query(fs.collection(db,'questions'), fs.where('app','==',a), fs.limit(400));
          return fs.onSnapshot(qy, snap=>{ const list=[]; snap.forEach(d=>list.push(d.data())); list.sort((x,y)=>(y.created||0)-(x.created||0)); cb(list); }, ()=>cb([])); },
        async clear(a){ const snap=await fs.getDocs(fs.query(fs.collection(db,'questions'), fs.where('app','==',a))); for (const dd of snap.docs){ await fs.deleteDoc(dd.ref); } } };
    } catch(e){ setLocal(); } }
  window.dispatchEvent(new Event('classq-ready'));
}
init();
</script>
